######################################################################################################################################
#以下为自定义参数区(本机/本环境覆盖)                                                                                                   #
#                                                                                                                                     #
#使用说明：                                                                                                                           #
#  1. 本文件随包发布，所有键值默认注释，取消注释才会覆盖 sys.ini 中的同名键。                                                         #
#  2. 键名必须带前缀(如 sys.ServerUrl)，原实现写成 ServerUrl 不带前缀，导致本文件从未生效。                                           #
#  3. 现场修改配置优先改启动目录下的 config/*.ini，不需要重新打包 jar；                                                  #
#     环境专属覆盖放 config/{local|test|pro}/*.ini，环境名由 -Dcdtest.env、                                                  #
#     环境变量 CDTEST_ENV 或本文件中的 sys.env 指定。                                                                                  #
#                                                                                                                                     #
######################################################################################################################################

#当前环境名：local/test/pro，对应 config/{env}/ 覆盖目录                                                                    #
#sys.env=

#选填，无默认值 服务完整地址                                                                                                         #
#sys.ServerUrl=
#选填，无默认值 服务完整域名                                                                                                         #
#sys.ServerWWW=
#选填，无默认值 服务IP                                                                                                               #
#sys.ServerIp=
#选填，无默认值 服务端口                                                                                                             #
#sys.ServerPort=
#选填，无默认值 服务名                                                                                                               #
#sys.ServerName=
#选填，无默认值 通信证书路径                                                                                                         #
#sys.JKS_PATH=
#选填，无默认值 通信证书密码(建议用环境变量 CDTEST_JKS_PASSWORD，不要写明文)                                                         #
#sys.JKS_PWD=
#选填，无默认值 通信用户别名                                                                                                         #
#sys.CommunicationUserALIAS=
#选填，无默认值 通信机构ID                                                                                                           #
#sys.CommunicationOrgID=
#选填，无默认值 通信用户账号                                                                                                         #
#sys.CommunicationUserID=
#选填，无默认值 通信用户证件照片                                                                                                     #
#sys.CommunicationImg=
#选填，无默认值 通信用户签章照片                                                                                                     #
#sys.CommunicationSeal=
######################################################################################################################################
